<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>width snap discriminators</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  .case { position: absolute; width: 160px; height: 40px; background: rgba(30,30,30,1);
          border: 1px solid rgba(255,255,255,1); box-sizing: border-box; }
  #w15  { left: 20px;  top: 20px;  border-width: 15px; }   /* 22.5 dev @1.5: floor=22 round=23 */
  #w13  { left: 20px;  top: 80px;  border-width: 1.3px; }  /* 1.95 dev @1.5: floor=1 round=2  */
  #w07  { left: 20px;  top: 140px; border-width: 0.5px; }  /* 0.75 dev @1.5 */
  #w15b { left: 20.25px; top: 200px; border-width: 15px; } /* fractional pos + 22.5 width */
</style></head>
<body>
  <div class="case" id="w15"></div>
  <div class="case" id="w13"></div>
  <div class="case" id="w07"></div>
  <div class="case" id="w15b"></div>
</body></html>
